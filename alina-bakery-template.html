<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alina Bakery - Bun Availability</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(135deg, #FFF8E7 0%, #FFE5B4 50%, #FFDAB9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', 'Garamond', serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
    }

    /* Decorative corner elements */
    .corner {
      position: absolute;
      width: 150px;
      height: 150px;
      border: 3px solid #8B4513;
      opacity: 0.3;
    }

    .corner.top-left {
      top: 40px;
      left: 40px;
      border-right: none;
      border-bottom: none;
    }

    .corner.top-right {
      top: 40px;
      right: 40px;
      border-left: none;
      border-bottom: none;
    }

    .corner.bottom-left {
      bottom: 40px;
      left: 40px;
      border-right: none;
      border-top: none;
    }

    .corner.bottom-right {
      bottom: 40px;
      right: 40px;
      border-left: none;
      border-top: none;
    }

    /* Logo */
    .logo {
      width: 200px;
      height: 200px;
      margin-bottom: 40px;
      background: white;
      border-radius: 50%;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(139, 69, 19, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Main content */
    .content {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 60px 80px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(139, 69, 19, 0.25);
      border: 4px solid #D2691E;
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 72px;
      color: #8B4513;
      margin-bottom: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(139, 69, 19, 0.1);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 48px;
      color: #A0522D;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .location {
      font-size: 56px;
      color: #D2691E;
      font-weight: bold;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .date-box {
      background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
      color: white;
      padding: 30px 60px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 6px 20px rgba(139, 69, 19, 0.4);
    }

    .date-label {
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .date {
      font-size: 52px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* Wheat decoration */
    .wheat {
      font-size: 40px;
      color: #DAA520;
      margin: 0 20px;
    }

    .tagline {
      margin-top: 40px;
      font-size: 32px;
      color: #8B4513;
      font-style: italic;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Decorative corners -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Logo -->
    <div class="logo">
      <img src="https://alinabakery.crawlingsloth.cloud/logo.png" alt="Alina Bakery">
    </div>

    <!-- Main content -->
    <div class="content">
      <div class="emoji">🥐</div>

      <h1>Buns Available</h1>
      <div class="subtitle">Today at</div>
      <div class="location">
        <span class="wheat">🌾</span>
        BLVQ
        <span class="wheat">🌾</span>
      </div>

      <div class="date-box">
        <div class="date-label">{{DAY}}</div>
        <div class="date">{{MONTH}} {{DATE}}, {{YEAR}}</div>
      </div>

      <div class="tagline">Freshly Baked with Love ❤️</div>
    </div>
  </div>
</body>
</html>
